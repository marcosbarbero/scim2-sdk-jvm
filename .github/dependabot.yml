version: 2
updates:
  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    ignore:
      # 3.6.0 breaks MockK's ByteBuddy agent self-attach on JDK 25; revisit on next release
      - dependency-name: "org.apache.maven.plugins:maven-surefire-plugin"
        versions: ["3.6.0"]
      - dependency-name: "org.apache.maven.plugins:maven-failsafe-plugin"
        versions: ["3.6.0"]
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.dokka*"
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework*"
      jackson:
        patterns:
          - "tools.jackson*"
          - "com.fasterxml.jackson*"
      testing:
        patterns:
          - "io.kotest*"
          - "io.mockk*"
          - "org.testcontainers*"
          - "au.com.dius.pact*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
